name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Biome Lint & Format Check
        run: bun run lint

      - name: TypeScript Typecheck
        run: bun run typecheck

      - name: Run Tests
        run: bun run test

      - name: Build Monorepo (Turbo)
        run: bun run build
